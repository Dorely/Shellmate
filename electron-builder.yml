appId: com.dorely.shellmate
productName: Shellmate
copyright: Copyright (c) 2026 Dorely
directories:
  output: release
  buildResources: build
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
win:
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: Shellmate-Setup-${version}.exe
npmRebuild: false
